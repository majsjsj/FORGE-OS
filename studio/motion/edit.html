<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11131a"><title>FORGE EDIT — Nonlinear Editing</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10131b;color:#e8eef8;font:13px Inter,system-ui,sans-serif}.head{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#171d28;border-bottom:1px solid #30394a}.brand{font-weight:900;letter-spacing:.12em;color:#fff;text-decoration:none}.brand b{color:#70e2d7}.tag{color:#9aa8bd;font:10px ui-monospace,monospace}.spacer{flex:1}.link{color:#aab8cc;text-decoration:none;font-size:10px}.state{color:#70e2d7;font:10px ui-monospace,monospace}iframe{display:block;width:100%;height:calc(100% - 52px);border:0;background:#10131b}.hint{position:absolute;top:60px;right:12px;z-index:3;background:#202a39dd;border:1px solid #43516a;border-radius:6px;padding:7px 10px;color:#aab8cc;font-size:10px;pointer-events:none;opacity:0;transition:opacity .3s}.hint.show{opacity:1}
</style></head><body><header class="head"><a class="brand" href="../index.html">FORGE <b>EDIT</b></a><span class="tag">MULTITRACK NONLINEAR EDITOR</span><span class="spacer"></span><span class="state" id="state">CONNECTING TO EDIT ENGINE…</span><a class="link" href="vox.html">OPEN VOX ↗</a><a class="link" href="index.html">MOTION ↗</a></header><div class="hint" id="hint">Opening the Multitrack Edit workspace…</div><iframe id="engine" title="FORGE Motion Multitrack Editing Engine" src="index.html#forge-edit"></iframe><script>
(()=>{const f=document.getElementById("engine"),s=document.getElementById("state"),h=document.getElementById("hint");let attempts=0;function activate(){try{const d=f.contentDocument;if(!d)return;const b=d.querySelector('[data-panel="multitrack"]');if(b){b.click();s.textContent="EDIT ENGINE CONNECTED";h.classList.add("show");setTimeout(()=>h.classList.remove("show"),2600);return;}if(attempts++<30)setTimeout(activate,250);else s.textContent="ENGINE PANEL NOT FOUND";}catch(e){s.textContent="ENGINE CONNECTION ERROR";}}f.addEventListener("load",()=>setTimeout(activate,150));})();
</script></body></html>
