name: Deploy FORGE Remote MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remote-mcp/**'
      - '.github/workflows/deploy-remote-mcp.yml'

permissions:
  contents: read

concurrency:
  group: forge-remote-mcp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Worker build dependencies
        working-directory: remote-mcp
        run: npm install --no-save --no-package-lock --no-audit --no-fund

      - name: Validate deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.FORGE_GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.FORGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::Missing FORGE_GITHUB_TOKEN"; exit 1; }
          test "${#ACCESS_TOKEN}" -ge 32 || { echo "::error::FORGE_ACCESS_TOKEN must contain at least 32 characters"; exit 1; }

      - name: Build MCP Apps preview bundle
        working-directory: remote-mcp
        run: npm run build:preview-app

      - name: Deploy Worker
        working-directory: remote-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Upload runtime secrets to Cloudflare
        working-directory: remote-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORGE_GITHUB_TOKEN: ${{ secrets.FORGE_GITHUB_TOKEN }}
          FORGE_ACCESS_TOKEN: ${{ secrets.FORGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$FORGE_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$FORGE_ACCESS_TOKEN" | npx wrangler secret put FORGE_ACCESS_TOKEN
