      - name: Add staged assets without overwriting project files
        if: inputs.sync_assets == true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          PROJECT_BRANCH: ${{ inputs.project_branch }}
          STAGED_ASSETS: ${{ runner.temp }}/forge-r2-assets
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path, PurePosixPath
