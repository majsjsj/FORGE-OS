name: FORGE On-Demand Engine Jobs

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Select only the toolchain needed for this task
        required: true
        type: choice
        options: [web, flutter, godot, unity]
      project_path:
        description: Project folder inside the repository (for example workspace/my-app)
        required: true
        type: string
      output:
        description: Build output
        required: true
        type: choice
        options: [test, apk, aab, web, linux]
        default: test
      project_branch:
        description: Isolated project branch to build (workflow itself must be dispatched from main)
        required: false
        type: string
      sync_assets:
        description: Explicitly download selected R2 assets for this run (off by default)
        required: false
        type: boolean
        default: false
      asset_paths:
        description: Newline-separated exact R2 asset paths; required when sync_assets is true (max 20 files / 24 MiB)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: forge-job-${{ github.workflow }}-${{ github.ref }}-${{ inputs.engine }}
  cancel-in-progress: true

jobs:
  sync_assets:
    if: inputs.sync_assets == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate and stage only explicitly selected R2 assets
        env:
          PROJECT_BRANCH: ${{ inputs.project_branch }}
          PROJECT_PATH: ${{ inputs.project_path }}
          ASSET_PATHS: ${{ inputs.asset_paths }}
          OIDC_AUDIENCE: https://forge-os-remote-mcp.majsjsj.workers.dev
          FORGE_ASSET_SYNC_URL: https://forge-os-remote-mcp.majsjsj.workers.dev/actions/assets
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, shutil, urllib.parse, urllib.request
          from pathlib import Path

          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("R2 sync must be dispatched from the trusted main workflow ref.")
          branch = os.environ.get("PROJECT_BRANCH", "")
          project = os.environ.get("PROJECT_PATH", "")
          if not branch.startswith("forge/projects/") or ".." in branch or "//" in branch:
              raise SystemExit("R2 sync requires an isolated forge/projects/ project_branch.")
          if not project.startswith("workspace/") or ".." in Path(project).parts:
              raise SystemExit("Invalid workspace project_path.")
          paths = [line.strip() for line in os.environ.get("ASSET_PATHS", "").splitlines() if line.strip()]
          if not 1 <= len(paths) <= 20 or len(set(paths)) != len(paths):
              raise SystemExit("Provide 1–20 unique newline-separated asset paths.")
          for value in paths:
              p = Path(value)
              if p.is_absolute() or "\\" in value or value == "forge-assets-manifest.json" or any(
                  part in ("", ".", "..") or part.startswith(".") for part in p.parts
              ):
                  raise SystemExit("Unsafe or reserved asset path: " + value)
              if any("secret" in part.lower() or "credential" in part.lower() for part in p.parts):
                  raise SystemExit("Credential-like asset path is blocked.")
              if p.suffix.lower() in {".pem", ".key", ".p12", ".pfx", ".jks", ".keystore", ".mobileprovision"}:
                  raise SystemExit("Private-key or signing asset paths are blocked.")
          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          parts = urllib.parse.urlsplit(request_url)
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(("audience", os.environ["OIDC_AUDIENCE"]))
          token_url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), parts.fragment))
          token_req = urllib.request.Request(token_url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              "Accept": "application/json"
          })
          with urllib.request.urlopen(token_req, timeout=15) as response:
              oidc_token = json.loads(response.read())["value"]
          payload = json.dumps({"project_branch": branch, "project_path": project, "asset_paths": paths}).encode()
          sync_req = urllib.request.Request(os.environ["FORGE_ASSET_SYNC_URL"], data=payload, method="POST", headers={
              "Authorization": "Bearer " + oidc_token, "Content-Type": "application/json", "Accept": "application/json"
          })
          with urllib.request.urlopen(sync_req, timeout=45) as response:
              result = json.loads(response.read())
          if result.get("ok") is not True or result.get("branch") != branch or result.get("project_path") != project:
              raise SystemExit("Worker returned an invalid asset sync response.")
          assets = result.get("assets")
          if not isinstance(assets, list) or len(assets) != len(paths):
              raise SystemExit("Worker did not return exactly the selected assets.")
          stage = Path(os.environ["RUNNER_TEMP"]) / "forge-r2-assets"
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)
          manifest_entries = []
          total = 0
          for asset in assets:
              rel = asset.get("path")
              if rel not in paths or not isinstance(asset.get("download_url"), str):
                  raise SystemExit("Worker returned an unselected or malformed asset.")
              target = stage / rel
              if not target.resolve().is_relative_to(stage.resolve()):
                  raise SystemExit("Worker returned an unsafe asset path.")
              target.parent.mkdir(parents=True, exist_ok=True)
              url = urllib.parse.urlsplit(asset["download_url"])
              if url.scheme != "https" or url.netloc != "forge-os-remote-mcp.majsjsj.workers.dev" or not url.path.startswith("/assets/"):
                  raise SystemExit("Worker returned a download URL outside the trusted asset endpoint.")
              with urllib.request.urlopen(asset["download_url"], timeout=45) as response:
                  data = response.read(16 * 1024 * 1024 + 1)
              if not data or len(data) > 16 * 1024 * 1024 or len(data) != asset.get("size_bytes"):
                  raise SystemExit("Downloaded asset size mismatch: " + rel)
              digest = hashlib.sha256(data).hexdigest()
              if digest != asset.get("sha256"):
                  raise SystemExit("Downloaded asset SHA-256 mismatch: " + rel)
              target.write_bytes(data)
              total += len(data)
              if total > 24 * 1024 * 1024:
                  raise SystemExit("R2 sync batch exceeds 24 MiB.")
              manifest_entries.append({"path": rel, "size_bytes": len(data), "sha256": digest,
                  "content_type": asset.get("content_type", "application/octet-stream")})
          manifest = {"format": "forge-assets-manifest-v1", "branch": branch, "project_path": project, "files": manifest_entries}
          (stage / "forge-assets-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("Verified and staged %d selected R2 assets (%d bytes)." % (len(paths), total))
          PY
      - name: Upload short-lived staged asset bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-r2-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-r2-assets/
          if-no-files-found: error
          retention-days: 1

  web:
    needs: [sync_assets]
    if: always() && inputs.engine == 'web' && (needs.sync_assets.result == 'success' || needs.sync_assets.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.project_branch || github.ref }}
      - name: Download selected R2 assets
        if: inputs.sync_assets == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forge-r2-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-r2-assets
      - name: Add staged assets without overwriting project files
        if: inputs.sync_assets == true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          PROJECT_BRANCH: ${{ inputs.project_branch }}
          STAGED_ASSETS: ${{ runner.temp }}/forge-r2-assets
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          project = Path(os.environ["PROJECT_PATH"])
          project_root = (root / project).resolve()
          stage = Path(os.environ["STAGED_ASSETS"]).resolve()
          if project.is_absolute() or ".." in project.parts or not project_root.is_relative_to(root) or not project_root.is_dir():
              raise SystemExit("Unsafe or missing target project directory.")
          manifest_file = stage / "forge-assets-manifest.json"
          if manifest_file.is_symlink() or not manifest_file.is_file():
              raise SystemExit("Staged R2 asset manifest is missing or unsafe.")
          incoming = json.loads(manifest_file.read_text(encoding="utf-8"))
          if incoming.get("format") != "forge-assets-manifest-v1" or incoming.get("branch") != os.environ["PROJECT_BRANCH"] or incoming.get("project_path") != project.as_posix():
              raise SystemExit("Staged R2 asset manifest does not match the selected project.")
          entries = incoming.get("files")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("No selected R2 assets were staged.")
          target_manifest = project_root / "forge-assets-manifest.json"
          existing = {"format": "forge-assets-manifest-v1", "branch": os.environ["PROJECT_BRANCH"], "project_path": project.as_posix(), "files": []}
          if target_manifest.exists():
              if target_manifest.is_symlink() or not target_manifest.is_file():
                  raise SystemExit("Existing project asset manifest is unsafe.")
              existing = json.loads(target_manifest.read_text(encoding="utf-8"))
              if existing.get("format") != "forge-assets-manifest-v1" or existing.get("branch") != os.environ["PROJECT_BRANCH"] or existing.get("project_path") != project.as_posix() or not isinstance(existing.get("files"), list):
                  raise SystemExit("Existing project asset manifest is invalid or belongs to another project.")
          known = {item.get("path") for item in existing["files"] if isinstance(item, dict)}
          for item in entries:
              rel = item.get("path")
              posix = PurePosixPath(rel) if isinstance(rel, str) else None
              if not posix or posix.is_absolute() or any(part in ("", ".", "..") or part.startswith(".") for part in posix.parts):
                  raise SystemExit("Unsafe path in staged manifest.")
              if rel in known:
                  raise SystemExit("Asset path already exists in manifest; refusing overwrite: " + rel)
              raw_source = stage / Path(*posix.parts)
              source = raw_source.resolve()
              raw_target = project_root / Path(*posix.parts)
              target = raw_target.resolve()
              if not source.is_relative_to(stage) or raw_source.is_symlink() or not raw_source.is_file():
                  raise SystemExit("Staged asset is missing or unsafe: " + rel)
              if not target.is_relative_to(project_root) or raw_target.exists() or raw_target.is_symlink():
                  raise SystemExit("Refusing to overwrite an existing project path: " + rel)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              known.add(rel)
          existing["files"].extend(entries)
          if len(existing["files"]) > 5000:
              raise SystemExit("The FORGE asset manifest is limited to 5,000 entries.")
          target_manifest.write_text(json.dumps(existing, indent=2) + "\n", encoding="utf-8")
          print("Added %d R2 assets to the project without overwriting existing files." % len(entries))
          PY
      - name: Verify explicitly staged external assets
        uses: majsjsj/FORGE-OS/.github/actions/verify-forge-assets@409082e725a53abc144790a3e00a4509815c64cf
        with:
          project_path: ${{ inputs.project_path }}
          project_branch: ${{ inputs.project_branch || github.ref_name }}
      - name: Validate project path
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_PATH"])
          root = Path.cwd().resolve()
          resolved = (root / p).resolve()
          if p.is_absolute() or ".." in p.parts or not resolved.is_relative_to(root):
              raise SystemExit("Unsafe project path")
          if not resolved.is_dir():
              raise SystemExit("Project directory not found")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Test and build web project
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci --ignore-scripts;
            else npm install --ignore-scripts; fi
            npm test --if-present
            if [ "$OUTPUT" = "web" ]; then npm run build --if-present; fi
          elif [ ! -s index.html ]; then
            echo "::error::Expected package.json or a non-empty index.html."
            exit 1
          fi
          if [ "$OUTPUT" = "test" ]; then
            echo "Web project checks completed; no source archive will be uploaded."
            exit 0
          fi
          if [ "$OUTPUT" != "web" ]; then
            echo "::error::Web engine supports only test or web output."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/forge-web-output"
          if [ -s dist/index.html ]; then
            cp -a dist/. "$RUNNER_TEMP/forge-web-output/"
          elif [ -s build/index.html ]; then
            cp -a build/. "$RUNNER_TEMP/forge-web-output/"
          elif [ -s out/index.html ]; then
            cp -a out/. "$RUNNER_TEMP/forge-web-output/"
          elif [ -s index.html ]; then
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='.cache/' \
              --exclude='.next/' \
              --exclude='.dart_tool/' \
              --exclude='.godot/' \
              --exclude='dist/' \
              --exclude='build/' \
              --exclude='out/' \
              ./ "$RUNNER_TEMP/forge-web-output/"
          else
            echo "::error::No deployable index.html found. Expected dist/, build/, out/, or project-root index.html."
            exit 1
          fi
          test -s "$RUNNER_TEMP/forge-web-output/index.html"
          echo "Prepared deployable web output only; dependencies and repository metadata are excluded."
      - name: Create artifact integrity manifest
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/forge-web-output
          ENGINE: web
          OUTPUT: ${{ inputs.output }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["ARTIFACT_ROOT"]).resolve()
          if not root.is_dir():
              raise SystemExit(f"Artifact directory missing: {root}")
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink() or not path.is_file() or path.name == "forge-artifact-manifest.json":
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append({"path": path.relative_to(root).as_posix(), "size": path.stat().st_size, "sha256": digest.hexdigest()})
          if not files:
              raise SystemExit("No files found to include in the artifact integrity manifest.")
          manifest = {"format": "forge-artifact-manifest-v1", "engine": os.environ["ENGINE"], "output": os.environ["OUTPUT"], "files": files}
          (root / "forge-artifact-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Manifest created for {len(files)} files.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && inputs.output == 'web'
        with:
          name: forge-web
          path: ${{ runner.temp }}/forge-web-output/**
          if-no-files-found: error
          retention-days: 3

  flutter:
    needs: [sync_assets]
    if: always() && inputs.engine == 'flutter' && (needs.sync_assets.result == 'success' || needs.sync_assets.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.project_branch || github.ref }}
      - name: Download selected R2 assets
        if: inputs.sync_assets == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forge-r2-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-r2-assets
      - name: Add staged assets without overwriting project files
        if: inputs.sync_assets == true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          PROJECT_BRANCH: ${{ inputs.project_branch }}
          STAGED_ASSETS: ${{ runner.temp }}/forge-r2-assets
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          project = Path(os.environ["PROJECT_PATH"])
          project_root = (root / project).resolve()
          stage = Path(os.environ["STAGED_ASSETS"]).resolve()
          if project.is_absolute() or ".." in project.parts or not project_root.is_relative_to(root) or not project_root.is_dir():
              raise SystemExit("Unsafe or missing target project directory.")
          manifest_file = stage / "forge-assets-manifest.json"
          if manifest_file.is_symlink() or not manifest_file.is_file():
              raise SystemExit("Staged R2 asset manifest is missing or unsafe.")
          incoming = json.loads(manifest_file.read_text(encoding="utf-8"))
          if incoming.get("format") != "forge-assets-manifest-v1" or incoming.get("branch") != os.environ["PROJECT_BRANCH"] or incoming.get("project_path") != project.as_posix():
              raise SystemExit("Staged R2 asset manifest does not match the selected project.")
          entries = incoming.get("files")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("No selected R2 assets were staged.")
          target_manifest = project_root / "forge-assets-manifest.json"
          existing = {"format": "forge-assets-manifest-v1", "branch": os.environ["PROJECT_BRANCH"], "project_path": project.as_posix(), "files": []}
          if target_manifest.exists():
              if target_manifest.is_symlink() or not target_manifest.is_file():
                  raise SystemExit("Existing project asset manifest is unsafe.")
              existing = json.loads(target_manifest.read_text(encoding="utf-8"))
              if existing.get("format") != "forge-assets-manifest-v1" or existing.get("branch") != os.environ["PROJECT_BRANCH"] or existing.get("project_path") != project.as_posix() or not isinstance(existing.get("files"), list):
                  raise SystemExit("Existing project asset manifest is invalid or belongs to another project.")
          known = {item.get("path") for item in existing["files"] if isinstance(item, dict)}
          for item in entries:
              rel = item.get("path")
              posix = PurePosixPath(rel) if isinstance(rel, str) else None
              if not posix or posix.is_absolute() or any(part in ("", ".", "..") or part.startswith(".") for part in posix.parts):
                  raise SystemExit("Unsafe path in staged manifest.")
              if rel in known:
                  raise SystemExit("Asset path already exists in manifest; refusing overwrite: " + rel)
              raw_source = stage / Path(*posix.parts)
              source = raw_source.resolve()
              raw_target = project_root / Path(*posix.parts)
              target = raw_target.resolve()
              if not source.is_relative_to(stage) or raw_source.is_symlink() or not raw_source.is_file():
                  raise SystemExit("Staged asset is missing or unsafe: " + rel)
              if not target.is_relative_to(project_root) or raw_target.exists() or raw_target.is_symlink():
                  raise SystemExit("Refusing to overwrite an existing project path: " + rel)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              known.add(rel)
          existing["files"].extend(entries)
          target_manifest.write_text(json.dumps(existing, indent=2) + "\n", encoding="utf-8")
          print("Added %d R2 assets to the project without overwriting existing files." % len(entries))
          PY
      - name: Verify explicitly staged external assets
        uses: majsjsj/FORGE-OS/.github/actions/verify-forge-assets@409082e725a53abc144790a3e00a4509815c64cf
        with:
          project_path: ${{ inputs.project_path }}
          project_branch: ${{ inputs.project_branch || github.ref_name }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Validate Flutter project
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          if p.is_absolute() or ".." in p.parts or not (Path.cwd()/p).resolve().is_relative_to(Path.cwd()): raise SystemExit("Unsafe project path")
          if not (Path.cwd()/p/"pubspec.yaml").is_file(): raise SystemExit("pubspec.yaml not found")
          PY
      - name: Verify Android SDK requirements
        if: inputs.output == 'apk' || inputs.output == 'aab'
        run: |
          fail() { echo "::error title=Android SDK check failed::$1"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            fail "Android SDK not found: ANDROID_HOME/ANDROID_SDK_ROOT is unset or its directory is missing on this runner."
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            fail "sdkmanager (Android cmdline-tools) not found under $SDK/cmdline-tools."
          fi

          JAVA_MAJOR="$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')"
          if [ "${JAVA_MAJOR:-0}" -lt 17 ]; then
            fail "Java 17 or newer is required for the Android build, found: ${JAVA_MAJOR:-unknown}."
          fi

          BT_LATEST="$(ls -1 "$SDK/build-tools" 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$BT_LATEST" ]; then
            fail "No Android build-tools found under $SDK/build-tools."
          fi
          if [ "$(printf '%s\n' 28.0.3 "$BT_LATEST" | sort -V | head -n1)" != "28.0.3" ]; then
            fail "Android build-tools $BT_LATEST is older than the 28.0.3 minimum required by Flutter."
          fi

          # Accept pending Android SDK package licenses as explicitly authorized by the repository owner.
          # This applies only to Android SDK licenses on this temporary GitHub Actions runner.
          set +o pipefail
          LICENSE_LOG="$(mktemp)"
          if ! yes | timeout 300 "$SDKMANAGER" --sdk_root="$SDK" --licenses > "$LICENSE_LOG" 2>&1; then
            echo "---- sdkmanager --licenses output (last 60 lines) ----"
            tail -n 60 "$LICENSE_LOG"
            fail "sdkmanager --licenses failed or timed out; Android SDK licenses could not be accepted."
          fi
          tail -n 5 "$LICENSE_LOG"
          if ! grep -q "All SDK package licenses accepted" "$LICENSE_LOG"; then
            echo "---- sdkmanager --licenses output (last 60 lines) ----"
            tail -n 60 "$LICENSE_LOG"
            fail "sdkmanager did not confirm that all Android SDK package licenses were accepted."
          fi

          echo "Android SDK check passed: sdk=$SDK build-tools=$BT_LATEST java=$JAVA_MAJOR licenses=accepted"
      - name: Generate Android platform when missing
        if: inputs.output == 'apk' || inputs.output == 'aab'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          if [ ! -d "$PROJECT_PATH/android" ]; then
            PROJECT_NAME="$(sed -n 's/^name:[[:space:]]*//p' "$PROJECT_PATH/pubspec.yaml" | head -n1 | tr -d "\"'")"
            if ! [[ "$PROJECT_NAME" =~ ^[a-z][a-z0-9_]*$ ]]; then PROJECT_NAME="forge_app"; fi
            flutter create --platforms=android --org com.forgeos --project-name "$PROJECT_NAME" /tmp/forge-android-scaffold
            cp -a /tmp/forge-android-scaffold/android "$PROJECT_PATH/android"
          fi
      - name: Test and build
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          cd "$PROJECT_PATH"
          flutter pub get
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Dart test files found; skipping flutter test."
          fi
          if [ "$OUTPUT" = apk ]; then flutter build apk --release;
          elif [ "$OUTPUT" = aab ]; then flutter build appbundle --release;
          elif [ "$OUTPUT" != test ]; then echo "Flutter output must be test, apk, or aab"; exit 1; fi
      - name: Create artifact integrity manifest
        if: success() && (inputs.output == 'apk' || inputs.output == 'aab')
        env:
          ARTIFACT_ROOT: ${{ inputs.project_path }}/build/app/outputs
          ENGINE: flutter
          OUTPUT: ${{ inputs.output }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["ARTIFACT_ROOT"]).resolve()
          if not root.is_dir():
              raise SystemExit(f"Artifact directory missing: {root}")
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink() or not path.is_file() or path.name == "forge-artifact-manifest.json":
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append({"path": path.relative_to(root).as_posix(), "size": path.stat().st_size, "sha256": digest.hexdigest()})
          if not files:
              raise SystemExit("No files found to include in the artifact integrity manifest.")
          manifest = {"format": "forge-artifact-manifest-v1", "engine": os.environ["ENGINE"], "output": os.environ["OUTPUT"], "files": files}
          (root / "forge-artifact-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Manifest created for {len(files)} files.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && (inputs.output == 'apk' || inputs.output == 'aab')
        with:
          name: forge-flutter-${{ inputs.output }}
          path: ${{ inputs.project_path }}/build/app/outputs/**
          if-no-files-found: error
          retention-days: 3

  godot:
    needs: [sync_assets]
    if: always() && inputs.engine == 'godot' && (needs.sync_assets.result == 'success' || needs.sync_assets.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.project_branch || github.ref }}
      - name: Download selected R2 assets
        if: inputs.sync_assets == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forge-r2-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/forge-r2-assets
      - name: Add staged assets without overwriting project files
        if: inputs.sync_assets == true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          PROJECT_BRANCH: ${{ inputs.project_branch }}
          STAGED_ASSETS: ${{ runner.temp }}/forge-r2-assets
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          project = Path(os.environ["PROJECT_PATH"])
          project_root = (root / project).resolve()
          stage = Path(os.environ["STAGED_ASSETS"]).resolve()
          if project.is_absolute() or ".." in project.parts or not project_root.is_relative_to(root) or not project_root.is_dir():
              raise SystemExit("Unsafe or missing target project directory.")
          manifest_file = stage / "forge-assets-manifest.json"
          if manifest_file.is_symlink() or not manifest_file.is_file():
              raise SystemExit("Staged R2 asset manifest is missing or unsafe.")
          incoming = json.loads(manifest_file.read_text(encoding="utf-8"))
          if incoming.get("format") != "forge-assets-manifest-v1" or incoming.get("branch") != os.environ["PROJECT_BRANCH"] or incoming.get("project_path") != project.as_posix():
              raise SystemExit("Staged R2 asset manifest does not match the selected project.")
          entries = incoming.get("files")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("No selected R2 assets were staged.")
          target_manifest = project_root / "forge-assets-manifest.json"
          existing = {"format": "forge-assets-manifest-v1", "branch": os.environ["PROJECT_BRANCH"], "project_path": project.as_posix(), "files": []}
          if target_manifest.exists():
              if target_manifest.is_symlink() or not target_manifest.is_file():
                  raise SystemExit("Existing project asset manifest is unsafe.")
              existing = json.loads(target_manifest.read_text(encoding="utf-8"))
              if existing.get("format") != "forge-assets-manifest-v1" or existing.get("branch") != os.environ["PROJECT_BRANCH"] or existing.get("project_path") != project.as_posix() or not isinstance(existing.get("files"), list):
                  raise SystemExit("Existing project asset manifest is invalid or belongs to another project.")
          known = {item.get("path") for item in existing["files"] if isinstance(item, dict)}
          for item in entries:
              rel = item.get("path")
              posix = PurePosixPath(rel) if isinstance(rel, str) else None
              if not posix or posix.is_absolute() or any(part in ("", ".", "..") or part.startswith(".") for part in posix.parts):
                  raise SystemExit("Unsafe path in staged manifest.")
              if rel in known:
                  raise SystemExit("Asset path already exists in manifest; refusing overwrite: " + rel)
              raw_source = stage / Path(*posix.parts)
              source = raw_source.resolve()
              raw_target = project_root / Path(*posix.parts)
              target = raw_target.resolve()
              if not source.is_relative_to(stage) or raw_source.is_symlink() or not raw_source.is_file():
                  raise SystemExit("Staged asset is missing or unsafe: " + rel)
              if not target.is_relative_to(project_root) or raw_target.exists() or raw_target.is_symlink():
                  raise SystemExit("Refusing to overwrite an existing project path: " + rel)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              known.add(rel)
          existing["files"].extend(entries)
          target_manifest.write_text(json.dumps(existing, indent=2) + "\n", encoding="utf-8")
          print("Added %d R2 assets to the project without overwriting existing files." % len(entries))
          PY
      - name: Verify explicitly staged external assets
        uses: majsjsj/FORGE-OS/.github/actions/verify-forge-assets@409082e725a53abc144790a3e00a4509815c64cf
        with:
          project_path: ${{ inputs.project_path }}
          project_branch: ${{ inputs.project_branch || github.ref_name }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: inputs.output == 'apk' || inputs.output == 'aab'
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure runner Android SDK and install Godot components
        if: inputs.output == 'apk' || inputs.output == 'aab'
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's ubuntu-latest runner image already includes the Android SDK.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found at $SDK"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android cmdline-tools sdkmanager was not found under $SDK/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null
          set -o pipefail
          echo "Android SDK configured at $SDK using $SDKMANAGER"
      - name: Install pinned Godot headless editor and export templates
        run: |
          GODOT_VERSION=4.4.1
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Validate project and import resources
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          if p.is_absolute() or ".." in p.parts or not (Path.cwd()/p).resolve().is_relative_to(Path.cwd()): raise SystemExit("Unsafe project path")
          if not (Path.cwd()/p/"project.godot").is_file(): raise SystemExit("project.godot not found")
          PY
          godot --headless --path "$PROJECT_PATH" --editor --import --quit
      - name: Install the matching Godot Android Gradle template
        if: inputs.output == 'aab'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          TEMPLATE="$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"
          if [ ! -s "$TEMPLATE" ]; then
            echo "::error::The Godot 4.4.1 Android Gradle source template is missing from the downloaded export templates."
            exit 1
          fi
          if [ ! -f "$PROJECT_PATH/android/build/build.gradle" ]; then
            mkdir -p "$PROJECT_PATH/android/build"
            unzip -q "$TEMPLATE" -d "$PROJECT_PATH/android/build"
          fi
          test -s "$PROJECT_PATH/android/build/build.gradle" || { echo "::error::Could not install android/build/build.gradle from the official template."; exit 1; }
      - name: Validate export preset
        if: inputs.output != 'test'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          cfg=p/"export_presets.cfg"
          if not cfg.is_file(): raise SystemExit("export_presets.cfg is required. Create the requested preset in Godot before exporting.")
          text=cfg.read_text(encoding="utf-8")
          sections=re.split(r"(?=^\[preset\.\d+\]\s*$)", text, flags=re.M)
          wanted={"apk":"Android","aab":"Android","web":"Web","linux":"Linux"}[os.environ["OUTPUT"]]
          block=next((s for s in sections if re.search(r'^name="'+re.escape(wanted)+r'"$',s,re.M)),None)
          if not block: raise SystemExit(f'Missing export preset named "{wanted}".')
          expected={"apk":"Android","aab":"Android","web":"Web","linux":"Linux/X11"}[os.environ["OUTPUT"]]
          if not re.search(r'^platform="'+expected+r'"$',block,re.M): raise SystemExit(f'Preset "{wanted}" has the wrong platform.')
          if os.environ["OUTPUT"]=="aab":
              if not re.search(r'^gradle_build/use_gradle_build=true$',block,re.M): raise SystemExit('AAB requires gradle_build/use_gradle_build=true in the Android preset.')
              if not (p/"android"/"build"/"build.gradle").is_file(): raise SystemExit('AAB requires the Godot Android Gradle build template at android/build/build.gradle.')
              if not re.search(r'^gradle_build/export_format=1$',block,re.M): raise SystemExit('AAB requires gradle_build/export_format=1 in the Android preset.')
          PY
      - name: Export Android debug APK
