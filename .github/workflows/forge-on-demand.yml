          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/forge-release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$GODOT_KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$GODOT_KEY_PASSWORD"
          mkdir -p "$PROJECT_PATH/build"
          godot --headless --path "$PROJECT_PATH" --export-release "Android" "build/forge-release.aab"
          test -s "$PROJECT_PATH/build/forge-release.aab"
      - name: Export Web or Linux build
        if: inputs.output == 'linux' || inputs.output == 'web'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          mkdir -p "$PROJECT_PATH/build"
          if [ "$OUTPUT" = "web" ]; then
            mkdir -p "$PROJECT_PATH/build/web"
            godot --headless --path "$PROJECT_PATH" --export-release "Web" "$PROJECT_PATH/build/web/index.html"
            test -s "$PROJECT_PATH/build/web/index.html"
          else
            godot --headless --path "$PROJECT_PATH" --export-release "Linux" "build/linux.x86_64"
            test -s "$PROJECT_PATH/build/linux.x86_64"
          fi
      - name: Create artifact integrity manifest
        if: success() && (inputs.output == 'apk' || inputs.output == 'aab' || inputs.output == 'linux' || inputs.output == 'web')
        env:
          ARTIFACT_ROOT: ${{ inputs.project_path }}/build
          ENGINE: godot
          OUTPUT: ${{ inputs.output }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["ARTIFACT_ROOT"]).resolve()
          if not root.is_dir():
              raise SystemExit(f"Artifact directory missing: {root}")
          files = []
          for path in sorted(root.rglob("*")):
