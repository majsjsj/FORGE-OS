          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path "$PROJECT_PATH" --export-debug "Android" "build/forge-android-debug.apk"
          test -s "$PROJECT_PATH/build/forge-android-debug.apk"
      - name: Export signed Android App Bundle
        if: inputs.output == 'aab'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          GODOT_KEYSTORE_B64: ${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}
          GODOT_KEY_ALIAS: ${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_USER }}
          GODOT_KEY_PASSWORD: ${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD }}
        run: |
          if [ -z "$GODOT_KEYSTORE_B64" ] || [ -z "$GODOT_KEY_ALIAS" ] || [ -z "$GODOT_KEY_PASSWORD" ]; then
            echo "::error::AAB release requires GODOT_ANDROID_KEYSTORE_BASE64, GODOT_ANDROID_KEYSTORE_RELEASE_USER and GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD repository secrets. No unsigned store bundle will be produced."
            exit 1
          fi
