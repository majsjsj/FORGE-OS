name: FORGE On-Demand Engine Jobs

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Select only the toolchain needed for this task
        required: true
        type: choice
        options: [web, flutter, godot, unity]
      project_path:
        description: Project folder inside the repository (for example workspace/my-app)
        required: true
        type: string
      output:
        description: Build output
        required: true
        type: choice
        options: [test, apk, aab, web, linux]
        default: test
      project_branch:
        description: Isolated project branch (defaults to the dispatch ref)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forge-job-${{ github.workflow }}-${{ github.ref }}-${{ inputs.engine }}
  cancel-in-progress: true

jobs:
  web:
    if: inputs.engine == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.project_branch || github.ref }}
          persist-credentials: false
      - name: Validate project path
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_PATH"])
          root = Path.cwd().resolve()
          resolved = (root / p).resolve()
          if p.is_absolute() or ".." in p.parts or not resolved.is_relative_to(root):
              raise SystemExit("Unsafe project path")
          if not resolved.is_dir():
              raise SystemExit("Project directory not found")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build web project
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci --ignore-scripts;
            else npm install --ignore-scripts; fi
            npm test --if-present
            if [ "$OUTPUT" = "web" ]; then npm run build --if-present; fi
          elif [ ! -s index.html ]; then
            echo "::error::Expected package.json or a non-empty index.html."
            exit 1
          fi
          if [ "$OUTPUT" = "test" ]; then
            echo "Web project checks completed; no source archive will be uploaded."
            exit 0
          fi
          if [ "$OUTPUT" != "web" ]; then
            echo "::error::Web engine supports only test or web output."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/forge-web-output"
          if [ -s dist/index.html ]; then
            cp -a dist/. "$RUNNER_TEMP/forge-web-output/"
          elif [ -s build/index.html ]; then
            cp -a build/. "$RUNNER_TEMP/forge-web-output/"
          elif [ -s out/index.html ]; then
            cp -a out/. "$RUNNER_TEMP/forge-web-output/"
          elif [ -s index.html ]; then
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='.cache/' \
              --exclude='.next/' \
              --exclude='.dart_tool/' \
              --exclude='.godot/' \
              --exclude='dist/' \
              --exclude='build/' \
              --exclude='out/' \
              ./ "$RUNNER_TEMP/forge-web-output/"
          else
            echo "::error::No deployable index.html found. Expected dist/, build/, out/, or project-root index.html."
            exit 1
          fi
          test -s "$RUNNER_TEMP/forge-web-output/index.html"
          echo "Prepared deployable web output only; dependencies and repository metadata are excluded."
      - uses: actions/upload-artifact@v4
        if: success() && inputs.output == 'web'
        with:
          name: forge-web
          path: ${{ runner.temp }}/forge-web-output/**
          if-no-files-found: error
          retention-days: 3

  flutter:
    if: inputs.engine == 'flutter'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.project_branch || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Validate Flutter project
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          if p.is_absolute() or ".." in p.parts or not (Path.cwd()/p).resolve().is_relative_to(Path.cwd()): raise SystemExit("Unsafe project path")
          if not (Path.cwd()/p/"pubspec.yaml").is_file(): raise SystemExit("pubspec.yaml not found")
          PY
      - name: Verify Android SDK requirements
        if: inputs.output == 'apk' || inputs.output == 'aab'
        run: |
          fail() { echo "::error title=Android SDK check failed::$1"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            fail "Android SDK not found: ANDROID_HOME/ANDROID_SDK_ROOT is unset or its directory is missing on this runner."
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            fail "sdkmanager (Android cmdline-tools) not found under $SDK/cmdline-tools."
          fi

          JAVA_MAJOR="$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')"
          if [ "${JAVA_MAJOR:-0}" -lt 17 ]; then
            fail "Java 17 or newer is required for the Android build, found: ${JAVA_MAJOR:-unknown}."
          fi

          BT_LATEST="$(ls -1 "$SDK/build-tools" 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$BT_LATEST" ]; then
            fail "No Android build-tools found under $SDK/build-tools."
          fi
          if [ "$(printf '%s\n' 28.0.3 "$BT_LATEST" | sort -V | head -n1)" != "28.0.3" ]; then
            fail "Android build-tools $BT_LATEST is older than the 28.0.3 minimum required by Flutter."
          fi

          # Accept pending Android SDK package licenses as explicitly authorized by the repository owner.
          # This applies only to Android SDK licenses on this temporary GitHub Actions runner.
          set +o pipefail
          LICENSE_LOG="$(mktemp)"
          if ! yes | timeout 300 "$SDKMANAGER" --sdk_root="$SDK" --licenses > "$LICENSE_LOG" 2>&1; then
            echo "---- sdkmanager --licenses output (last 60 lines) ----"
            tail -n 60 "$LICENSE_LOG"
            fail "sdkmanager --licenses failed or timed out; Android SDK licenses could not be accepted."
          fi
          tail -n 5 "$LICENSE_LOG"
          if ! grep -q "All SDK package licenses accepted" "$LICENSE_LOG"; then
            echo "---- sdkmanager --licenses output (last 60 lines) ----"
            tail -n 60 "$LICENSE_LOG"
            fail "sdkmanager did not confirm that all Android SDK package licenses were accepted."
          fi

          echo "Android SDK check passed: sdk=$SDK build-tools=$BT_LATEST java=$JAVA_MAJOR licenses=accepted"
      - name: Generate Android platform when missing
        if: inputs.output == 'apk' || inputs.output == 'aab'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          if [ ! -d "$PROJECT_PATH/android" ]; then
            PROJECT_NAME="$(sed -n 's/^name:[[:space:]]*//p' "$PROJECT_PATH/pubspec.yaml" | head -n1 | tr -d "\"'")"
            if ! [[ "$PROJECT_NAME" =~ ^[a-z][a-z0-9_]*$ ]]; then PROJECT_NAME="forge_app"; fi
            flutter create --platforms=android --org com.forgeos --project-name "$PROJECT_NAME" /tmp/forge-android-scaffold
            cp -a /tmp/forge-android-scaffold/android "$PROJECT_PATH/android"
          fi
      - name: Test and build
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          cd "$PROJECT_PATH"
          flutter pub get
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Dart test files found; skipping flutter test."
          fi
          if [ "$OUTPUT" = apk ]; then flutter build apk --release;
          elif [ "$OUTPUT" = aab ]; then flutter build appbundle --release;
          elif [ "$OUTPUT" != test ]; then echo "Flutter output must be test, apk, or aab"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: success() && (inputs.output == 'apk' || inputs.output == 'aab')
        with:
          name: forge-flutter-${{ inputs.output }}
          path: ${{ inputs.project_path }}/build/app/outputs/**
          if-no-files-found: error
          retention-days: 3

  godot:
    if: inputs.engine == 'godot'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.project_branch || github.ref }}
      - uses: actions/setup-java@v4
        if: inputs.output == 'apk' || inputs.output == 'aab'
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure runner Android SDK and install Godot components
        if: inputs.output == 'apk' || inputs.output == 'aab'
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's ubuntu-latest runner image already includes the Android SDK.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found at $SDK"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android cmdline-tools sdkmanager was not found under $SDK/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null
          set -o pipefail
          echo "Android SDK configured at $SDK using $SDKMANAGER"
      - name: Install pinned Godot headless editor and export templates
        run: |
          GODOT_VERSION=4.4.1
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Validate project and import resources
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          if p.is_absolute() or ".." in p.parts or not (Path.cwd()/p).resolve().is_relative_to(Path.cwd()): raise SystemExit("Unsafe project path")
          if not (Path.cwd()/p/"project.godot").is_file(): raise SystemExit("project.godot not found")
          PY
          godot --headless --path "$PROJECT_PATH" --editor --import --quit
      - name: Install the matching Godot Android Gradle template
        if: inputs.output == 'aab'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          TEMPLATE="$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"
          if [ ! -s "$TEMPLATE" ]; then
            echo "::error::The Godot 4.4.1 Android Gradle source template is missing from the downloaded export templates."
            exit 1
          fi
          if [ ! -f "$PROJECT_PATH/android/build/build.gradle" ]; then
            mkdir -p "$PROJECT_PATH/android/build"
            unzip -q "$TEMPLATE" -d "$PROJECT_PATH/android/build"
          fi
          test -s "$PROJECT_PATH/android/build/build.gradle" || { echo "::error::Could not install android/build/build.gradle from the official template."; exit 1; }
      - name: Validate export preset
        if: inputs.output != 'test'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          cfg=p/"export_presets.cfg"
          if not cfg.is_file(): raise SystemExit("export_presets.cfg is required. Create the requested preset in Godot before exporting.")
          text=cfg.read_text(encoding="utf-8")
          sections=re.split(r"(?=^\[preset\.\d+\]\s*$)", text, flags=re.M)
          wanted={"apk":"Android","aab":"Android","web":"Web","linux":"Linux"}[os.environ["OUTPUT"]]
          block=next((s for s in sections if re.search(r'^name="'+re.escape(wanted)+r'"$',s,re.M)),None)
          if not block: raise SystemExit(f'Missing export preset named "{wanted}".')
          expected={"apk":"Android","aab":"Android","web":"Web","linux":"Linux/X11"}[os.environ["OUTPUT"]]
          if not re.search(r'^platform="'+expected+r'"$',block,re.M): raise SystemExit(f'Preset "{wanted}" has the wrong platform.')
          if os.environ["OUTPUT"]=="aab":
              if not re.search(r'^gradle_build/use_gradle_build=true$',block,re.M): raise SystemExit('AAB requires gradle_build/use_gradle_build=true in the Android preset.')
              if not (p/"android"/"build"/"build.gradle").is_file(): raise SystemExit('AAB requires the Godot Android Gradle build template at android/build/build.gradle.')
              if not re.search(r'^gradle_build/export_format=1$',block,re.M): raise SystemExit('AAB requires gradle_build/export_format=1 in the Android preset.')
          PY
      - name: Export Android debug APK
        if: inputs.output == 'apk'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          mkdir -p "$HOME/.android" "$PROJECT_PATH/build"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=FORGE-OS,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path "$PROJECT_PATH" --export-debug "Android" "build/forge-android-debug.apk"
          test -s "$PROJECT_PATH/build/forge-android-debug.apk"
      - name: Export signed Android App Bundle
        if: inputs.output == 'aab'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          GODOT_KEYSTORE_B64: ${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}
          GODOT_KEY_ALIAS: ${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_USER }}
          GODOT_KEY_PASSWORD: ${{ secrets.GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD }}
        run: |
          if [ -z "$GODOT_KEYSTORE_B64" ] || [ -z "$GODOT_KEY_ALIAS" ] || [ -z "$GODOT_KEY_PASSWORD" ]; then
            echo "::error::AAB release requires GODOT_ANDROID_KEYSTORE_BASE64, GODOT_ANDROID_KEYSTORE_RELEASE_USER and GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD repository secrets. No unsigned store bundle will be produced."
            exit 1
          fi
          printf '%s' "$GODOT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/forge-release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/forge-release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$GODOT_KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$GODOT_KEY_PASSWORD"
          mkdir -p "$PROJECT_PATH/build"
          godot --headless --path "$PROJECT_PATH" --export-release "Android" "build/forge-release.aab"
          test -s "$PROJECT_PATH/build/forge-release.aab"
      - name: Export Web or Linux build
        if: inputs.output == 'linux' || inputs.output == 'web'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          OUTPUT: ${{ inputs.output }}
        run: |
          mkdir -p "$PROJECT_PATH/build"
          if [ "$OUTPUT" = "web" ]; then
            godot --headless --path "$PROJECT_PATH" --export-release "Web" "build/web.zip"
            mkdir -p "$PROJECT_PATH/build/web"
            unzip -q "$PROJECT_PATH/build/web.zip" -d "$PROJECT_PATH/build/web"
            test -s "$PROJECT_PATH/build/web/index.html"
          else
            godot --headless --path "$PROJECT_PATH" --export-release "Linux" "build/linux.x86_64"
            test -s "$PROJECT_PATH/build/linux.x86_64"
          fi
      - uses: actions/upload-artifact@v4
        if: success() && (inputs.output == 'apk' || inputs.output == 'aab' || inputs.output == 'linux' || inputs.output == 'web')
        with:
          name: forge-godot-${{ inputs.output }}
          path: ${{ inputs.project_path }}/build/**
          if-no-files-found: error
          retention-days: 3

  unity:
    if: inputs.engine == 'unity'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.project_branch || github.ref }}
      - name: Validate Unity project and license
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          OUTPUT: ${{ inputs.output }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEY_ALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          if p.is_absolute() or ".." in p.parts or not (Path.cwd()/p).resolve().is_relative_to(Path.cwd()): raise SystemExit("Unsafe project path")
          if not (p/"Assets").is_dir() or not (p/"ProjectSettings"/"ProjectVersion.txt").is_file(): raise SystemExit("Not a valid Unity project: Assets/ and ProjectSettings/ProjectVersion.txt are required.")
          if not os.environ.get("UNITY_LICENSE"): raise SystemExit("Unity cloud build is disabled until UNITY_LICENSE is added as a GitHub Actions secret.")
          if os.environ["OUTPUT"]=="aab":
              missing=[n for n,v in [("ANDROID_KEYSTORE_BASE64",os.environ.get("ANDROID_KEYSTORE")),("ANDROID_KEYSTORE_PASS",os.environ.get("ANDROID_KEYSTORE_PASS")),("ANDROID_KEYALIAS_NAME",os.environ.get("ANDROID_KEY_ALIAS")),("ANDROID_KEYALIAS_PASS",os.environ.get("ANDROID_KEY_ALIAS_PASS"))] if not v]
              if missing: raise SystemExit("AAB release requires repository secrets: "+", ".join(missing))
              settings=(p/"ProjectSettings"/"ProjectSettings.asset").read_text(encoding="utf-8")
              if not re.search(r"^  AndroidUseCustomKeystore: 1$",settings,re.M):
                  raise SystemExit("Enable Custom Keystore in Unity Player Settings before requesting an AAB.")
          PY
      - name: Build Unity Android APK
        if: inputs.output == 'apk'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ inputs.project_path }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildsPath: build
      - name: Build Unity Android AAB
        if: inputs.output == 'aab'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ inputs.project_path }}
          targetPlatform: Android
          androidExportType: androidAppBundle
          androidKeystoreName: forge-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildsPath: build
      - name: Disable WebGL compression for reliable GitHub Pages preview
        if: inputs.output == 'web'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          settings=Path(os.environ["PROJECT_PATH"])/"ProjectSettings"/"ProjectSettings.asset"
          content=settings.read_text(encoding="utf-8")
          updated,n=re.subn(r"(?m)^  webGLCompressionFormat: .*?$","  webGLCompressionFormat: 0",content)
          if n != 1: raise SystemExit("Could not safely set webGLCompressionFormat in ProjectSettings.asset; check this Unity project version before building WebGL.")
          settings.write_text(updated,encoding="utf-8")
          PY
      - name: Build Unity WebGL
        if: inputs.output == 'web'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ inputs.project_path }}
          targetPlatform: WebGL
          buildsPath: build
      - name: Build Unity Linux
        if: inputs.output == 'linux'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ inputs.project_path }}
          targetPlatform: StandaloneLinux64
          buildsPath: build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-unity-${{ inputs.output }}
          path: build/**
          if-no-files-found: error
          retention-days: 3


  publish-game-preview:
    if: ${{ !cancelled() && inputs.output == 'web' && (inputs.engine == 'godot' || inputs.engine == 'unity') }}
    needs: [godot, unity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}game-preview/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.project_branch || github.ref }}
      - name: Download browser game build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.engine == 'godot' && 'forge-godot-web' || 'forge-unity-web' }}
          path: build
      - name: Prepare Studio and game preview site
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p _site/studio _site/workspace/blank-project _site/game-preview
          cp site/index.html _site/index.html
          cp studio/index.html studio/studio.css studio/studio.js _site/studio/
          cp workspace/blank-project/index.html workspace/blank-project/styles.css workspace/blank-project/script.js _site/workspace/blank-project/
          ENTRY="$(find build -type f -name index.html -print -quit)"
          if [ -z "$ENTRY" ]; then
            echo "::error::The Web export artifact does not contain index.html."
            find build -maxdepth 4 -type f | head -n 80
            exit 1
          fi
          cp -a "$(dirname "$ENTRY")/." _site/game-preview/
          touch _site/.nojekyll
          touch _site/game-preview/.nojekyll
          echo "Prepared $ENGINE browser build from $ENTRY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy interactive game preview
        id: deployment
        uses: actions/deploy-pages@v4
