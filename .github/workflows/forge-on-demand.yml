        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          settings=Path(os.environ["PROJECT_PATH"])/"ProjectSettings"/"ProjectSettings.asset"
          content=settings.read_text(encoding="utf-8")
          updated,n=re.subn(r"(?m)^  webGLCompressionFormat: .*?$","  webGLCompressionFormat: 0",content)
          if n != 1: raise SystemExit("Could not safely set webGLCompressionFormat in ProjectSettings.asset; check this Unity project version before building WebGL.")
          settings.write_text(updated,encoding="utf-8")
          PY
      - name: Build Unity WebGL
        if: inputs.output == 'web'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ inputs.project_path }}
          targetPlatform: WebGL
          buildsPath: build
      - name: Build Unity Linux
        if: inputs.output == 'linux'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ inputs.project_path }}
          targetPlatform: StandaloneLinux64
          buildsPath: build
      - name: Create artifact integrity manifest
        if: success() && inputs.output != 'test'
        env:
          ARTIFACT_ROOT: build
          ENGINE: unity
          OUTPUT: ${{ inputs.output }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["ARTIFACT_ROOT"]).resolve()
          if not root.is_dir():
              raise SystemExit(f"Artifact directory missing: {root}")
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink() or not path.is_file() or path.name == "forge-artifact-manifest.json":
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append({"path": path.relative_to(root).as_posix(), "size": path.stat().st_size, "sha256": digest.hexdigest()})
          if not files:
              raise SystemExit("No files found to include in the artifact integrity manifest.")
          manifest = {"format": "forge-artifact-manifest-v1", "engine": os.environ["ENGINE"], "output": os.environ["OUTPUT"], "files": files}
          (root / "forge-artifact-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Manifest created for {len(files)} files.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.output == 'test'
        with:
          name: forge-unity-test-results
          path: artifacts/unity-tests
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && inputs.output != 'test'
        with:
          name: forge-unity-${{ inputs.output }}
          path: build/**
          if-no-files-found: error
          retention-days: 3


  publish-game-preview:
    if: >-
      !cancelled() && inputs.output == 'web' &&
      ((inputs.engine == 'godot' && needs.godot.result == 'success') ||
       (inputs.engine == 'unity' && needs.unity.result == 'success'))
    needs: [godot, unity]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}game-preview/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download browser game build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.engine == 'godot' && 'forge-godot-web' || 'forge-unity-web' }}
          path: build
      - name: Prepare Studio and game preview site
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p _site/studio _site/workspace/blank-project _site/game-preview
          cp site/index.html _site/index.html
          cp studio/index.html studio/studio.css studio/studio.js studio/features.js studio/advanced-tools.js _site/studio/
          cp workspace/blank-project/index.html workspace/blank-project/styles.css workspace/blank-project/script.js _site/workspace/blank-project/
          ENTRY="$(find build -type f -name index.html -print -quit)"
          if [ -z "$ENTRY" ]; then
            echo "::error::The Web export artifact does not contain index.html."
            find build -maxdepth 4 -type f | head -n 80
            exit 1
          fi
          cp -a "$(dirname "$ENTRY")/." _site/game-preview/
          touch _site/.nojekyll
          touch _site/game-preview/.nojekyll
          echo "Prepared $ENGINE browser build from $ENTRY"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy interactive game preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  attest-artifact:
    needs: [web, flutter, godot, unity]
    if: >-
      always() &&
      inputs.output != 'test' &&
      (
        (inputs.engine == 'web' && needs.web.result == 'success') ||
        (inputs.engine == 'flutter' && needs.flutter.result == 'success') ||
        (inputs.engine == 'godot' && needs.godot.result == 'success') ||
        (inputs.engine == 'unity' && needs.unity.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download web artifact for attestation
        if: inputs.engine == 'web'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forge-web
          path: ${{ runner.temp }}/forge-artifact
      - name: Download Flutter artifact for attestation
        if: inputs.engine == 'flutter'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forge-flutter-${{ inputs.output }}
          path: ${{ runner.temp }}/forge-artifact
      - name: Download Godot artifact for attestation
        if: inputs.engine == 'godot'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forge-godot-${{ inputs.output }}
          path: ${{ runner.temp }}/forge-artifact
      - name: Download Unity artifact for attestation
        if: inputs.engine == 'unity'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: forge-unity-${{ inputs.output }}
          path: ${{ runner.temp }}/forge-artifact
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify the complete artifact manifest before signing
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/forge-artifact
          EXPECTED_ENGINE: ${{ inputs.engine }}
          EXPECTED_OUTPUT: ${{ inputs.output }}
        run: |
          python scripts/verify-forge-artifact.py --root "$ARTIFACT_ROOT" --engine "$EXPECTED_ENGINE" --output "$EXPECTED_OUTPUT"
      - name: Generate signed GitHub artifact attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/forge-artifact/forge-artifact-manifest.json
      - name: Publish attestation verification details
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs['attestation-url'] }}
          ENGINE: ${{ inputs.engine }}
          OUTPUT: ${{ inputs.output }}
        run: |
          {
            echo "## Signed artifact attestation"
            echo "- Engine: `$ENGINE`"
            echo "- Output: `$OUTPUT`"
            echo "- Attestation: $ATTESTATION_URL"
            echo "- The signed subject is `forge-artifact-manifest.json`, which contains SHA-256 hashes for every file in the build artifact."
          } >> "$GITHUB_STEP_SUMMARY"
