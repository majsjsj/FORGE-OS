        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p=Path(os.environ["PROJECT_PATH"])
          if p.is_absolute() or ".." in p.parts or not (Path.cwd()/p).resolve().is_relative_to(Path.cwd()): raise SystemExit("Unsafe project path")
          if not (p/"Assets").is_dir() or not (p/"ProjectSettings"/"ProjectVersion.txt").is_file(): raise SystemExit("Not a valid Unity project: Assets/ and ProjectSettings/ProjectVersion.txt are required.")
          if not os.environ.get("UNITY_LICENSE"): raise SystemExit("Unity cloud build is disabled until UNITY_LICENSE is added as a GitHub Actions secret.")
          if os.environ["OUTPUT"]=="aab":
              missing=[n for n,v in [("ANDROID_KEYSTORE_BASE64",os.environ.get("ANDROID_KEYSTORE")),("ANDROID_KEYSTORE_PASS",os.environ.get("ANDROID_KEYSTORE_PASS")),("ANDROID_KEYALIAS_NAME",os.environ.get("ANDROID_KEY_ALIAS")),("ANDROID_KEYALIAS_PASS",os.environ.get("ANDROID_KEY_ALIAS_PASS"))] if not v]
              if missing: raise SystemExit("AAB release requires repository secrets: "+", ".join(missing))
              settings=(p/"ProjectSettings"/"ProjectSettings.asset").read_text(encoding="utf-8")
              if not re.search(r"^  AndroidUseCustomKeystore: 1$",settings,re.M):
                  raise SystemExit("Enable Custom Keystore in Unity Player Settings before requesting an AAB.")
          PY
      - name: Run Unity EditMode and PlayMode tests
        if: inputs.output == 'test'
        id: unity-tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
