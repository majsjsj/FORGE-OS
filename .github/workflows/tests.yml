name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Remote MCP UI build dependencies
        working-directory: remote-mcp
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Build MCP Apps preview bundle
        working-directory: remote-mcp
        run: npm run build:preview-app
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
      - run: uv sync --dev
      - name: Enforce immutable external GitHub Actions references
        run: python scripts/verify_actions_pinned.py
      - run: uv run pytest
      - run: uv run ruff check .
      - name: Check blank workspace JavaScript
        run: node --check workspace/blank-project/script.js
      - name: Check browser studio JavaScript
        run: node --check studio/studio.js
      - name: Check Studio feature modules JavaScript
        run: node --check studio/features.js
      - name: Check advanced Studio tools JavaScript
        run: node --check studio/advanced-tools.js
      - name: Verify deployed Studio bundles include all runtime modules
        run: |
          grep -q 'studio/advanced-tools.js _site/studio/' .github/workflows/deploy-web-studio.yml
          grep -q 'studio/advanced-tools.js _site/studio/' .github/workflows/forge-on-demand.yml
      - name: Check remote MCP Worker JavaScript
        run: node --check remote-mcp/src/index.js
      - name: Test remote MCP Worker signed asset routes
        run: node --test remote-mcp/test/*.test.js
      - name: Check artifact manifest verifier Python syntax
        run: python -m py_compile scripts/verify-forge-artifact.py
