name: Deploy FORGE Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "workspace/blank-project/**"
      - "site/**"
      - ".github/workflows/deploy-web-studio.yml"
  workflow_dispatch:


concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site/studio _site/workspace/blank-project
          cp site/index.html _site/index.html
          cp studio/index.html studio/studio.css studio/studio.js studio/features.js studio/advanced-tools.js _site/studio/
          cp workspace/blank-project/index.html workspace/blank-project/styles.css workspace/blank-project/script.js _site/workspace/blank-project/
      - name: Remove previous Pages artifacts from this run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.filter(item => item.name === "github-pages")) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
