name: Deploy FORGE Studio

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "workspace/blank-project/**"
      - "site/**"
      - ".github/workflows/deploy-web-studio.yml"
  workflow_dispatch:


concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site/studio _site/studio/motion _site/workspace/blank-project
          cp site/index.html _site/index.html
          cp studio/index.html studio/studio.css studio/studio.js studio/features.js studio/advanced-tools.js _site/studio/
          cp -R studio/motion/. _site/studio/motion/
          cp workspace/blank-project/index.html workspace/blank-project/styles.css workspace/blank-project/script.js _site/workspace/blank-project/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
