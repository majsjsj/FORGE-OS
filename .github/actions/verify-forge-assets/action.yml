name: Verify FORGE staged assets
description: Verify SHA-256 and path integrity for assets explicitly imported from R2
inputs:
  project_path:
    description: Repository-relative project directory
    required: true
  project_branch:
    description: Isolated project branch being built
    required: true
runs:
  using: composite
  steps:
    - name: Verify staged asset manifest
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project_path }}
        PROJECT_BRANCH: ${{ inputs.project_branch }}
      run: |
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path, PurePosixPath

        project = Path(os.environ["PROJECT_PATH"])
        branch = os.environ["PROJECT_BRANCH"]
        root = Path.cwd().resolve()
        project_root = (root / project).resolve()
        if project.is_absolute() or ".." in project.parts or not project_root.is_relative_to(root) or not project_root.is_dir():
            raise SystemExit("Unsafe or missing project path while verifying asset manifest.")

        manifest_path = project_root / "forge-assets-manifest.json"
        if not manifest_path.exists():
            print("No FORGE external-asset manifest found; nothing to verify.")
            raise SystemExit(0)
        if manifest_path.is_symlink() or not manifest_path.is_file():
            raise SystemExit("Asset manifest must be a regular, non-symlink file.")

        try:
            manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
        except Exception as exc:
            raise SystemExit(f"Asset manifest is not valid JSON: {exc}")
        if manifest.get("format") != "forge-assets-manifest-v1":
            raise SystemExit("Unsupported FORGE asset manifest format.")
        if manifest.get("branch") != branch or manifest.get("project_path") != project.as_posix():
            raise SystemExit("Asset manifest branch/project does not match this build target.")
        entries = manifest.get("files")
        if not isinstance(entries, list) or not entries:
            raise SystemExit("Asset manifest has no file entries.")
        seen = set()
        for entry in entries:
            if not isinstance(entry, dict):
                raise SystemExit("Invalid asset manifest entry.")
            rel = entry.get("path")
            expected_size = entry.get("size_bytes")
            expected_hash = entry.get("sha256")
            if not isinstance(rel, str) or not rel or "\\" in rel:
                raise SystemExit("Asset manifest contains an invalid relative path.")
            posix = PurePosixPath(rel)
            if posix.is_absolute() or any(part in ("", ".", "..") or part.startswith(".") for part in posix.parts):
                raise SystemExit(f"Unsafe asset path in manifest: {rel}")
            if rel in seen:
                raise SystemExit(f"Duplicate asset path in manifest: {rel}")
            seen.add(rel)
            target = (project_root / Path(*posix.parts)).resolve()
            if not target.is_relative_to(project_root) or target.is_symlink() or not target.is_file():
                raise SystemExit(f"Staged asset is missing or unsafe: {rel}")
            if not isinstance(expected_size, int) or expected_size <= 0 or target.stat().st_size != expected_size:
                raise SystemExit(f"Staged asset size mismatch: {rel}")
            if not isinstance(expected_hash, str) or len(expected_hash) != 64:
                raise SystemExit(f"Invalid SHA-256 value in manifest: {rel}")
            digest = hashlib.sha256()
            with target.open("rb") as stream:
                for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                    digest.update(chunk)
            if digest.hexdigest() != expected_hash.lower():
                raise SystemExit(f"Staged asset SHA-256 mismatch: {rel}")
        print(f"Verified {len(entries)} staged asset(s) against SHA-256 manifest.")
        PY
