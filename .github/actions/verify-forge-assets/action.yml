name: Verify FORGE staged assets
description: Verify SHA-256 and path integrity for assets explicitly staged from R2 or the optional OIDC sync
inputs:
  project_path:
    description: Repository-relative project directory
    required: true
  project_branch:
    description: Isolated project branch being built
    required: true
runs:
  using: composite
  steps:
    - name: Verify staged asset manifest
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project_path }}
        PROJECT_BRANCH: ${{ inputs.project_branch }}
      run: python "${{ github.action_path }}/verify_assets.py"
