[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-os"
version = "0.3.0"
description = "Model-agnostic agentic software engineering workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["mcp>=1.2.0,<2.0.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.optional-dependencies]
vision = ["Pillow>=10.0"]

[project.scripts]
forge = "forge_os.cli:main"
forge-mcp = "forge_os.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["forge_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
